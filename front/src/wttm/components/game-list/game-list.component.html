<div class="games-list">
    @for (game of games(); track game.id) {
        <div class="game-item">
            <div class="game-info">
                <div class="game-creator">{{ game.name }}</div>
            </div>

            <button mat-stroked-button class="join-button" (click)="joinGame(game.id)">
                Rejoindre
            </button>
        </div>
    } @empty {
        <div class="game-item">Aucune partie en cours</div>
    }
</div>
