name: Construction & Deploiement du site sur OVH

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
  
    runs-on: ubuntu-latest
    environment: prod

    strategy:
      matrix:
        node-version: [24.x]

    steps:
    
    - uses: actions/checkout@v4

    - name: Calcul de la version
      run: echo "BUILD_VERSION=$(date -u +'%Y.%m.%d-%H%M') (build ${{ github.run_number }})" >> "$GITHUB_ENV"

    - name: Remplacement des variables d'environnement
      run: node scripts/replace-env.mjs front/src/environments/environment.prod.ts
      env:
        SECRET_PUSHER_KEY: ${{ secrets.SECRET_PUSHER_KEY }}
        FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
        FIREBASE_BDD_URL: ${{ secrets.FIREBASE_BDD_URL }}
        FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
        FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
        FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        
    - name: Install Front Dependencies
      if: steps.cache-nodemodules.outputs.cache-hit != 'true'
      run: npm ci
      working-directory: ./front
      
    - name: Build Front
      run: npm run build -- --configuration production --base-href /wttm/ --deploy-url /wttm/
      working-directory: ./front
      
    - name: Déploiement Front
      uses: SamKirkland/FTP-Deploy-Action@4.3.0
      with:
        server: ${{ secrets.OVH_SERVER }}
        local-dir: ./front/dist/wttm-flip/browser/
        server-dir: /www/wttm/
        dangerous-clean-slate: true
        username: ${{ secrets.OVH_USERNAME }}
        password: ${{ secrets.OVH_PASSWORD }}
    
      